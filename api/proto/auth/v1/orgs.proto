syntax = "proto3";

package auth.v1;

option go_package = "github.com/manovaspace/orbit-auth/api/auth/v1;authv1";

import "auth/v1/auth.proto";

// OrgService creates organizations and manages their memberships.
//
// The caller is always taken from the validated access token, never from the
// request body. Orbit Auth gates every organization-scoped call on the caller
// being an active member of that organization (NotFound otherwise).
//
// Every membership and invitation write additionally needs organization
// administration authority: the caller must be an active owner or admin, an
// admin can change only plain members, and only an owner can grant owner or
// admin. A caller without that authority gets PermissionDenied. An organization
// always keeps at least one active owner (FailedPrecondition). Any active member
// may remove themselves. The owner/admin/member tier is not a product role:
// products keep their own roles and permissions (ADR-045).
service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc ListMyOrgs(ListMyOrgsRequest) returns (ListMyOrgsResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc SuspendMember(SuspendMemberRequest) returns (SuspendMemberResponse);
  // SetOrgSlug changes the organization's slug, which is the label of its
  // tenant host. Only an owner may. The old slug stays reserved for the
  // organization and keeps resolving to it.
  rpc SetOrgSlug(SetOrgSlugRequest) returns (SetOrgSlugResponse);
  // SetMemberRole changes a member's organization administration tier.
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  // InviteMember creates a pending invitation to an email address (sent as the
  // org_invite email through orbit-notifications) or to a phone number (no
  // message is sent yet; the response carries the token for the inviter to
  // share). The caller must be an active owner or admin. Re-inviting the same
  // recipient rotates the pending invite.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  // AcceptInvite consumes one invitation token. It works for any authenticated
  // user, not only an existing member: the account email must match the invite
  // and the invite must still be pending and unexpired. Every failure is the
  // same generic invalid-invite error.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // ListInvites lists an organization's invitations. Tokens are never returned.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // SelectOrg switches the caller's active organization. It rotates the
  // presented refresh token and returns a new access/refresh pair that carries
  // the org claim. The refresh token is required because the access token is
  // stateless and cannot be revoked; rotation is what makes the switch durable
  // and prevents an old pair from silently selecting the new organization.
  rpc SelectOrg(SelectOrgRequest) returns (SelectOrgResponse);
}

message Organization {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string updated_at = 4;
  // slug is the current host label: 3 to 30 lowercase letters, digits and
  // hyphens, unique across organizations and across time.
  string slug = 5;
}

// InviteService is public, like TenantService: the invitee has no session yet
// when they open an invitation link. Both RPCs take only the invitation token.
// Every failure of a token is the same NotFound.
service InviteService {
  // GetInvitePreview shows what an invitation grants before the holder signs
  // in: the organization, its tier and the expiry. It never returns the
  // recipient's email address or phone number.
  rpc GetInvitePreview(GetInvitePreviewRequest) returns (InvitePreview);
  // AcceptInviteWithSignup creates the account for a phone invitation, sets
  // its password and display name, joins the organization with the invited
  // tier and returns the new user. The account's mobile number is the invited
  // number and is not verified: no OTP proved it. If an account already uses
  // the number, the call is AlreadyExists and the person must sign in and call
  // AcceptInvite instead. Email invitations are not accepted here.
  rpc AcceptInviteWithSignup(AcceptInviteWithSignupRequest) returns (AcceptInviteWithSignupResponse);
}

// TenantService answers which organization a tenant host label belongs to. It
// is public on purpose: the edge asks it before anyone has signed in, so it
// returns only the organization id, name and current slug and never members.
service TenantService {
  // ResolveTenant finds the organization that holds or once held the slug. A
  // retired slug resolves to the same organization and reports its current slug
  // so the edge can redirect. An unknown or invalid slug is NotFound.
  rpc ResolveTenant(ResolveTenantRequest) returns (ResolveTenantResponse);
}

message GetInvitePreviewRequest {
  string token = 1;
}

// InvitePreview is what a holder of an invitation token may see before
// accepting it. It carries no recipient address.
message InvitePreview {
  string org_id = 1;
  string org_name = 2;
  string org_slug = 3;
  // owner, admin or member.
  string role = 4;
  string expires_at = 5;
}

message AcceptInviteWithSignupRequest {
  string token = 1;
  string password = 2;
  string display_name = 3;
}

message AcceptInviteWithSignupResponse {
  string user_id = 1;
  string org_id = 2;
}

message ResolveTenantRequest {
  string slug = 1;
}

message ResolveTenantResponse {
  string org_id = 1;
  string name = 2;
  // slug is the organization's current slug.
  string slug = 3;
  // retired is true when the requested slug is no longer the current one.
  bool retired = 4;
  // suspended is true while staff have suspended the organization. The
  // organization is still returned; only selecting into it is refused.
  bool suspended = 5;
}

message Membership {
  string org_id = 1;
  string user_id = 2;
  string status = 3;
  string created_at = 4;
  string updated_at = 5;
  // owner, admin or member: the organization administration tier.
  string role = 6;
}

// Invite is an organization invitation without its secret token.
message Invite {
  string id = 1;
  string org_id = 2;
  string email = 3;
  string inviter_id = 4;
  // pending, accepted or revoked.
  string status = 5;
  string expires_at = 6;
  string accepted_at = 7;
  string created_at = 8;
  // phone is the invited E.164 number of a phone invitation. Exactly one of
  // email and phone is set.
  string phone = 9;
  // role is the organization tier the invitee receives: owner, admin or member.
  string role = 10;
}

message CreateOrgRequest {
  string name = 1;
  // slug is optional. When empty it is derived from the name.
  string slug = 2;
}

message SetOrgSlugRequest {
  string org_id = 1;
  string slug = 2;
}

message SetOrgSlugResponse {
  Organization organization = 1;
}

message CreateOrgResponse {
  Organization organization = 1;
}

message ListMyOrgsRequest {}

message ListMyOrgsResponse {
  repeated Organization organizations = 1;
}

message ListMembersRequest {
  string org_id = 1;
}

message ListMembersResponse {
  repeated Membership members = 1;
}

message AddMemberRequest {
  string org_id = 1;
  string user_id = 2;
}

message AddMemberResponse {}

message RemoveMemberRequest {
  string org_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message SuspendMemberRequest {
  string org_id = 1;
  string user_id = 2;
}

message SuspendMemberResponse {}

message SetMemberRoleRequest {
  string org_id = 1;
  string user_id = 2;
  // owner, admin or member.
  string role = 3;
}

message SetMemberRoleResponse {
  Membership membership = 1;
}

message InviteMemberRequest {
  string org_id = 1;
  string email = 2;
  // phone is an E.164 number. Set exactly one of email and phone.
  string phone = 3;
  // role is owner, admin or member. Empty means member.
  string role = 4;
}

message InviteMemberResponse {
  Invite invite = 1;
  // token is the raw invitation token. It is returned only from this call and
  // only for a phone invitation, which has no email to carry it; it is never
  // stored in clear and never returned by any other RPC.
  string token = 2;
}

message AcceptInviteRequest {
  string token = 1;
}

message AcceptInviteResponse {
  Invite invite = 1;
}

message RevokeInviteRequest {
  string org_id = 1;
  string invite_id = 2;
}

message RevokeInviteResponse {}

message ListInvitesRequest {
  string org_id = 1;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message SelectOrgRequest {
  string org_id = 1;
  // Refresh token from the current session. It is rotated and revoked, matching
  // RefreshToken, so an old refresh token cannot keep selecting organizations.
  string refresh_token = 2;
}

message SelectOrgResponse {
  TokenResponse tokens = 1;
}
