syntax = "proto3";

package auth.v1;

option go_package = "github.com/manovaspace/orbit-auth/api/auth/v1;authv1";

// StaffOrgService is the Manova staff surface over organizations. It is not
// for the public edge. The gateway authenticates staff (Keycloak) and is the
// only caller. Every call carries the service token in x-orbit-service-token
// and the staff subject in x-staff-subject. Every write RPC also carries
// x-staff-reason, which is recorded with the change. Without a configured
// service token every call is refused with Unavailable, and a missing or wrong
// token with Unauthenticated.
//
// Staff are never members of an organization. Staff operations bypass the
// membership policy, and every write is logged with the staff subject and the
// reason.
service StaffOrgService {
  // ListOrganizations pages through organizations, oldest first. The query
  // matches the name or the slug, case-insensitively.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  // GetOrganization returns one organization with its members and pending
  // invitations. Token hashes are never returned.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  // ProvisionOrganization creates an organization with no members and one
  // pending owner invitation, in one transaction. A repeated idempotency_key
  // with the same name and owner returns the same organization and rotates the
  // owner invitation; a phone owner's response then carries the new token. A
  // repeat with another name or owner is refused with ALREADY_EXISTS.
  rpc ProvisionOrganization(ProvisionOrganizationRequest) returns (ProvisionOrganizationResponse);
  // SuspendOrganization stops selecting into and refreshing into the
  // organization. Its members keep their memberships.
  rpc SuspendOrganization(SuspendOrganizationRequest) returns (SuspendOrganizationResponse);
  // ReactivateOrganization lifts a suspension.
  rpc ReactivateOrganization(ReactivateOrganizationRequest) returns (ReactivateOrganizationResponse);
  // SetOrganizationSlug changes the slug through the same registry rules as
  // the owner's SetOrgSlug: the old slug stays reserved for the organization.
  // The auth.org.slug_changed event names the staff subject as its actor and
  // carries the reason.
  rpc SetOrganizationSlug(SetOrganizationSlugRequest) returns (SetOrganizationSlugResponse);
  // ReinviteOwner issues a new owner invitation to an email address or a phone
  // number and rotates the pending one for that recipient.
  rpc ReinviteOwner(ReinviteOwnerRequest) returns (ReinviteOwnerResponse);
}

// StaffUserService is the Manova staff surface over accounts and the audit
// trail. It follows the same edge rules as StaffOrgService: the gateway is the
// only caller, every call carries x-orbit-service-token and x-staff-subject, and
// every write RPC also carries x-staff-reason. Staff are never members of an
// organization, so no membership policy applies. Staff never see a password
// hash, a token or an email address in an audit row.
service StaffUserService {
  // ListUsers pages through accounts, oldest first. The query matches the
  // email, mobile number, username or display name, case-insensitively.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // GetUser returns one account with its organization memberships.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // DisableUser makes an active account disabled. Every refresh token of the
  // account is revoked at once. A still-valid access token keeps working at
  // most 15 minutes, because access tokens are not checked against the account.
  // A disabled account is unchanged and reports changed=false. A pending account
  // is FAILED_PRECONDITION.
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse);
  // EnableUser makes a disabled account active again. The user signs in again;
  // refresh tokens revoked by the disable are not restored. An active account
  // reports changed=false. A pending account is FAILED_PRECONDITION.
  rpc EnableUser(EnableUserRequest) returns (EnableUserResponse);
  // ListAuditEvents pages through audit rows, newest first. The request must
  // name an organization, a user or both.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

// StaffUser is an account as staff see it. It carries no password hash, token or
// hash of either.
message StaffUser {
  string id = 1;
  string email = 2;
  string mobile = 3;
  string username = 4;
  string display_name = 5;
  // active, disabled or signup_pending.
  string status = 6;
  bool email_verified = 7;
  bool mobile_verified = 8;
  bool has_password = 9;
  bool google_linked = 10;
  string created_at = 11;
  string last_login_at = 12;
  string disabled_at = 13;
  string disabled_reason = 14;
  int64 membership_count = 15;
}

// StaffUserMembership is one organization membership of an account.
message StaffUserMembership {
  string org_id = 1;
  string org_name = 2;
  string org_slug = 3;
  // active or suspended.
  string org_status = 4;
  // owner, admin or member.
  string role = 5;
  // active, invited or suspended.
  string status = 6;
  string joined_at = 7;
}

// AuditEvent is one durable audit row. details is a JSON object. It never holds
// an email address, a mobile number, a password, a token or a hash.
message AuditEvent {
  int64 id = 1;
  string occurred_at = 2;
  string action = 3;
  // user, staff or system.
  string actor_kind = 4;
  // The user id for a user actor, the staff subject for a staff actor; empty for
  // a system actor.
  string actor_id = 5;
  string org_id = 6;
  string subject_user_id = 7;
  string invite_id = 8;
  string reason = 9;
  string details = 10;
}

message ListUsersRequest {
  string query = 1;
  // "", active, disabled or signup_pending.
  string status = 2;
  // At most 100. Zero means the default page size.
  int32 page_size = 3;
  // The next_page_token of the previous page. Empty starts at the beginning.
  string page_token = 4;
}

message ListUsersResponse {
  repeated StaffUser users = 1;
  // Empty when there is no further page.
  string next_page_token = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  StaffUser user = 1;
  repeated StaffUserMembership memberships = 2;
}

message DisableUserRequest {
  string user_id = 1;
}

message DisableUserResponse {
  // false when the account was already disabled.
  bool changed = 1;
}

message EnableUserRequest {
  string user_id = 1;
}

message EnableUserResponse {
  // false when the account was already active.
  bool changed = 1;
}

message ListAuditEventsRequest {
  // At least one of org_id and user_id is required.
  string org_id = 1;
  string user_id = 2;
  // At most 100. Zero means the default page size.
  int32 page_size = 3;
  // The next_page_token of the previous page. Empty starts at the beginning.
  string page_token = 4;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  // Empty when there is no further page.
  string next_page_token = 2;
}

// StaffOrganization is an organization as staff see it.
message StaffOrganization {
  string id = 1;
  string name = 2;
  string slug = 3;
  // active or suspended.
  string status = 4;
  string created_at = 5;
  // member_count counts every membership, whatever its lifecycle status.
  int64 member_count = 6;
  // owner_user_ids are the owners whose membership is active.
  repeated string owner_user_ids = 7;
  // suspended_at and suspended_reason are set while the organization is
  // suspended.
  string suspended_at = 8;
  string suspended_reason = 9;
}

message StaffMember {
  string user_id = 1;
  // owner, admin or member.
  string role = 2;
  // active, invited or suspended.
  string status = 3;
  string joined_at = 4;
}

// StaffInvite is a pending invitation without its token.
message StaffInvite {
  string id = 1;
  string email = 2;
  string phone = 3;
  // owner, admin or member.
  string role = 4;
  string expires_at = 5;
}

message ListOrganizationsRequest {
  string query = 1;
  // active or suspended. Empty lists both.
  string status = 2;
  // At most 100. Zero means the default page size.
  int32 page_size = 3;
  // The next_page_token of the previous page. Empty starts at the beginning.
  string page_token = 4;
}

message ListOrganizationsResponse {
  repeated StaffOrganization organizations = 1;
  // Empty when there is no further page.
  string next_page_token = 2;
}

message GetOrganizationRequest {
  string org_id = 1;
}

message GetOrganizationResponse {
  StaffOrganization organization = 1;
  repeated StaffMember members = 2;
  repeated StaffInvite pending_invites = 3;
}

message ProvisionOrganizationRequest {
  string name = 1;
  // Optional. Empty derives the slug from the name.
  string slug = 2;
  // Exactly one of owner_email and owner_phone.
  string owner_email = 3;
  string owner_phone = 4;
  // Required. A repeat must carry the same name and owner as the request that
  // first used the key; otherwise it is refused with ALREADY_EXISTS.
  string idempotency_key = 5;
  // Optional acceptance page for an email owner, with the same rules as
  // InviteMemberRequest.accept_url; "{slug}" is the organization's allocated
  // slug. A phone owner validates it and ignores it.
  string accept_url = 6;
}

message ProvisionOrganizationResponse {
  StaffOrganization organization = 1;
  StaffInvite owner_invite = 2;
  // token is the raw owner token for a phone invitation only, which has no
  // email to carry it. It is never returned again.
  string token = 3;
}

message SuspendOrganizationRequest {
  string org_id = 1;
}

message SuspendOrganizationResponse {
  StaffOrganization organization = 1;
}

message ReactivateOrganizationRequest {
  string org_id = 1;
}

message ReactivateOrganizationResponse {
  StaffOrganization organization = 1;
}

message SetOrganizationSlugRequest {
  string org_id = 1;
  string slug = 2;
}

message SetOrganizationSlugResponse {
  StaffOrganization organization = 1;
}

message ReinviteOwnerRequest {
  string org_id = 1;
  // Exactly one of owner_email and owner_phone.
  string owner_email = 2;
  string owner_phone = 3;
  // Optional acceptance page, with the same rules as InviteMemberRequest.accept_url.
  string accept_url = 4;
}

message ReinviteOwnerResponse {
  StaffInvite invite = 1;
  // token is the raw owner token for a phone invitation only.
  string token = 2;
}
