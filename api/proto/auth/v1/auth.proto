syntax = "proto3";

package auth.v1;

option go_package = "github.com/manovaspace/orbit-auth/api/auth/v1;authv1";

service AuthService {
  rpc RequestOTP(RequestOTPRequest) returns (RequestOTPResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (TokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
  // Idempotent: always succeeds for unknown, revoked or expired tokens.
  rpc RevokeRefreshToken(RevokeRefreshTokenRequest) returns (RevokeRefreshTokenResponse);
  rpc CreateApiToken(CreateApiTokenRequest) returns (CreateApiTokenResponse);
  rpc ListApiTokens(ListApiTokensRequest) returns (ListApiTokensResponse);
  rpc RevokeApiToken(RevokeApiTokenRequest) returns (RevokeApiTokenResponse);
  rpc ValidateApiToken(ValidateApiTokenRequest) returns (ValidateApiTokenResponse);
  // Sets the username of the caller. Requires a verified bearer access token.
  rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse);
  // Google sign-in, off unless GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET_FILE and
  // GOOGLE_REDIRECT_URIS are all set. Both run before any sign-in, so neither
  // carries a bearer token. The state of a sign-in is a sign_in or an invite
  // state; a link state is refused here (see AccountService).
  rpc StartGoogleSignIn(StartGoogleSignInRequest) returns (StartGoogleSignInResponse);
  rpc CompleteGoogleSignIn(CompleteGoogleSignInRequest) returns (CompleteGoogleSignInResponse);
}

message RequestOTPRequest {
  string email = 1 [deprecated = true];
  string correlation_id = 2;
  string identifier = 3;
  string channel = 4;
}

message RequestOTPResponse {
  string expires_at = 1;
}

message VerifyOTPRequest {
  string email = 1 [deprecated = true];
  string code = 2;
  string identifier = 3;
  string channel = 4;
}

message VerifyOTPResponse {
  TokenResponse tokens = 1;
}

message LoginWithPasswordRequest {
  string email = 1 [deprecated = true];
  string password = 2;
  // Username, mobile number or email address. Takes precedence over email.
  string identifier = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RevokeRefreshTokenRequest {
  string refresh_token = 1;
}

message RevokeRefreshTokenResponse {}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string expires_at = 3;
}

message CreateApiTokenRequest {
  string user_id = 1;
  string name = 2;
  repeated string scopes = 3;
  string expires_at = 4;
}

message CreateApiTokenResponse {
  string token_id = 1;
  string prefix = 2;
  string secret = 3;
}

message ListApiTokensRequest {
  string user_id = 1;
}

message ApiTokenInfo {
  string token_id = 1;
  string name = 2;
  string prefix = 3;
  repeated string scopes = 4;
  string expires_at = 5;
  string created_at = 6;
}

message ListApiTokensResponse {
  repeated ApiTokenInfo tokens = 1;
}

message RevokeApiTokenRequest {
  string user_id = 1;
  string token_id = 2;
}

message RevokeApiTokenResponse {}

message ValidateApiTokenRequest {
  string secret = 1;
}

message ValidateApiTokenResponse {
  string user_id = 1;
  repeated string scopes = 2;
}

message SetUsernameRequest {
  // The account is the verified access-token subject.
  string username = 1;
}

message SetUsernameResponse {
  // The stored form: trimmed and lower case.
  string username = 1;
}

message StartGoogleSignInRequest {
  // Must equal one of GOOGLE_REDIRECT_URIS exactly.
  string redirect_uri = 1;
  // A path on this product's origin, or empty for "/".
  string return_to = 2;
  // An email invitation token. When set, the sign-in accepts that invitation
  // for the Google account. The token is checked now and never stored. A phone
  // invitation is refused with FailedPrecondition. Empty is a plain sign-in.
  string invite_token = 3;
}

message StartGoogleSignInResponse {
  // Send the browser here. It carries the state and the PKCE challenge.
  string authorization_url = 1;
  // Opaque, single use, valid for ten minutes. The caller keeps it and
  // compares it with the state Google returns.
  string state = 2;
}

message CompleteGoogleSignInRequest {
  string state = 1;
  // The authorization code Google returned to the redirect URI.
  string code = 2;
}

message CompleteGoogleSignInResponse {
  TokenResponse tokens = 1;
  // The return_to given to StartGoogleSignIn, "/" when it was empty.
  string return_to = 2;
  // The invitation the sign-in accepted. Empty for a plain sign-in.
  string invite_id = 3;
  // The organization of the accepted invitation. Its tokens carry no
  // organization when the organization is suspended.
  string org_id = 4;
  string org_slug = 5;
  // owner, admin or member: the stored tier of the membership.
  string role = 6;
  // True when the account was already an active member; the stored role is kept.
  bool already_member = 7;
}
