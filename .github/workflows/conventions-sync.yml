name: conventions-sync

# Weekly: copies the shared conventions from manovaspace/ci into AGENTS.md and opens a pull request
# when they changed. Copy this file to .github/workflows/ of the repository and commit it.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: manovaspace/ci/.github/workflows/conventions-sync.yml@v1
