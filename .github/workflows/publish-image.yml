# GHCR publish for orbit-auth.
# Skip for libraries without a Dockerfile.
# After first push: GitHub → Packages → package → Package settings → Change visibility → Public.
# Stable: v* tags → semver + latest + edge. Dogfood: workflow_dispatch → edge + sha-*.
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing vX.Y.Z release tag to rebuild from its source commit
        required: false
        type: string

concurrency:
  group: publish-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker:
    if: github.repository_owner == 'manovaspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Resolve release tag
        id: release
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          version="$(./scripts/resolve-image-tag.sh "$SOURCE_TAG" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_tag || github.ref }}
          fetch-depth: 0
          path: source
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/manovaspace/orbit-auth
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.source_tag != '' }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.source_tag == '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
